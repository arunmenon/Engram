# PDLC evaluation set on real data: Apache OpenDAL (ADR-0018 decision 10).
#
# The ledger is deliveries.json in this directory: GitHub webhook deliveries
# rebuilt from OpenDAL's git history (build_deliveries.py) and sent through
# the signed webhook route, so the real GitHub adapter translates them:
#   288 merged PRs since v0.58.0 (squash commits), and
#   4 releases (v0.58.1, v0.58.2, v0.59.0, v0.59.1) with the notes from
#   CHANGELOG.md that list their PRs (57, 62, 51 and 6 PRs).
# OpenDAL stands in until our own GitHub and Jira are wired: it has no Jira,
# and git carries no reviews, CI runs, deployments or ticket links, so this
# set covers releases, reverts and finding a change by what it did.
#
# Every expected answer comes from git or CHANGELOG.md, not from retrieval:
#   release-of-*      the release whose notes link the PR (/pull/N)
#   release-contents  every PR the release's notes link
#   reverted-*        the revert PR whose body quotes the reverted PR's title
#   change-for-*      the one PR in the window whose title states the feature
#                     (grep of PR titles; the question uses the title's words)
#   release-for-*     that PR's release
#
# Measured at PDLC 1.4.0 with the traversal drift rules: mean F1 0.63. The
# three gaps it showed, and their fixes:
#   reverted-* 0.22: no REVERTS edge, as the rule read only "revert #N" while
#     git's revert quotes the reverted PR's title, "(#N)" inside it. PDLC
#     1.5.0 also reads 'Revert "<title> (#N)"' and "Reverts owner/repo#N".
#     The answer is read as what the walk reached (proactive), not the
#     change the question names.
#   release-contents-v0.59.1 0.92: #8228, "chore: prepare release v0.59.1",
#     was a seed through the version in its title. A key token that is a
#     node's own key now names that node only.
#   change-for-* 0.18-0.50: words such as "added", "support" and "service"
#     seeded 2-9 extra changes. Words are now used only when no #N or key
#     token found a node, weighted by rarity, at half weight when found only
#     in a body; "s3" and "429" are words now.
#
# Measured at PDLC 1.5.0: mean F1 0.91.
#   1.00  all but the three below
#   0.33  change-for-gcs-grpc: #7927, its revert #7943 ("services/gcs" holds
#         both "gcs" and "service"), and #8185/#8186 ("enable gcs-grpc
#         service", "update generated gcs-grpc service docs") match too
#   0.67  change-for-gcs-compose: also #8153, "add GCS gRPC service"
#   0.50  release-for-gcs-grpc: those changes bring their releases
#   The remaining limit is lexical: substring words cannot tell "added the
#   service" from "enabled the service"; embeddings or the title's verb would.
# min_f1 sits just under the measured level, so the gate catches regressions;
# raise it as the gaps are fixed.
#
# Queries are quoted: in YAML " #" starts a comment.
pack: pdlc
min_f1: 0.9
questions:
  # Release membership: which release shipped a PR
  - id: release-of-8216
    query: "Which release shipped #8216?"
    expected: ["Release:apache/opendal|v0.59.1"]
    answer: {node_type: Release}
  - id: release-of-8191
    query: "Which release shipped #8191?"
    expected: ["Release:apache/opendal|v0.59.0"]
    answer: {node_type: Release}
  - id: release-of-7949
    query: "Which release shipped #7949?"
    expected: ["Release:apache/opendal|v0.58.2"]
    answer: {node_type: Release}
  - id: release-of-8035
    query: "Which release shipped #8035?"
    expected: ["Release:apache/opendal|v0.58.2"]
    answer: {node_type: Release}
  - id: release-of-7386
    query: "Which release shipped #7386?"
    expected: ["Release:apache/opendal|v0.58.1"]
    answer: {node_type: Release}
  - id: release-of-7869
    query: "Which release shipped #7869?"
    expected: ["Release:apache/opendal|v0.58.1"]
    answer: {node_type: Release}

  # Release contents
  - id: release-contents-v0.59.1
    query: "What shipped in release v0.59.1?"
    expected: ["Change:apache/opendal|8206", "Change:apache/opendal|8213", "Change:apache/opendal|8214",
               "Change:apache/opendal|8215", "Change:apache/opendal|8216", "Change:apache/opendal|8223"]
    answer: {node_type: Change}

  # Reverts: the revert's body is "Revert \"<title> (#N)\"\n\nThis reverts commit <sha>."
  - id: reverted-7983
    query: "Which change reverted #7983?"
    expected: ["Change:apache/opendal|8034"]
    answer: {node_type: Change, reasons: [proactive]}   # what the walk reached, not the change asked about
  - id: reverted-7927
    query: "Was #7927 reverted?"
    expected: ["Change:apache/opendal|7943"]
    answer: {node_type: Change, reasons: [proactive]}   # what the walk reached, not the change asked about

  # Finding a change by what it did
  - id: change-for-s3-express
    query: "Which change added S3 Express session authentication?"
    expected: ["Change:apache/opendal|8135"]
    answer: {node_type: Change}
  - id: change-for-s3-restoration
    query: "Which change added S3 object restoration?"
    expected: ["Change:apache/opendal|8143"]
    answer: {node_type: Change}
  - id: change-for-gcs-grpc
    query: "Which change added the GCS gRPC service?"
    expected: ["Change:apache/opendal|8153"]
    answer: {node_type: Change}
  - id: change-for-aws-profiles
    query: "Which change added explicit AWS profiles for S3?"
    expected: ["Change:apache/opendal|7949"]
    answer: {node_type: Change}
  - id: change-for-http-429
    query: "Which change retries HTTP 429 responses?"
    expected: ["Change:apache/opendal|8035"]
    answer: {node_type: Change}
  - id: change-for-gcs-compose
    query: "Which change added GCS compose support?"
    expected: ["Change:apache/opendal|8191"]
    answer: {node_type: Change}

  # Two hops: a feature, then its release
  - id: release-for-gcs-grpc
    query: "Which release shipped the GCS gRPC service?"
    expected: ["Release:apache/opendal|v0.59.0"]
    answer: {node_type: Release}
  - id: release-for-s3-express
    query: "Which release shipped S3 Express session authentication?"
    expected: ["Release:apache/opendal|v0.59.0"]
    answer: {node_type: Release}
