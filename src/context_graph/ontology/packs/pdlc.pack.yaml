# Ontology pack: PDLC (product development lifecycle)
# Status: v1.0 frozen for sign-off (2026-10-04). Changes after sign-off go through a new pack version.
# History: v0.1 draft; v0.2 standards check; v0.3 competency questions; v0.4 real-project mapping; v1.0 freeze;
#          v1.0.1 declares content_hash on Constraint and Lesson (their key; the loader found it undeclared);
#          v1.0.2 makes every type Sourced (as the Sourced note says) and lets Incident be OWNED_BY (it is Owned);
#          v1.1.0 adds projection rules for ticket.created/closed, change.updated/abandoned and incident.resolved
#          (the GitHub and Jira webhook adapters emit them; additive only);
#          v1.2.0 adds keywords to the five intents, so retrieval can classify queries, and has change.merged
#          also set title, body and files (a change first seen at merge was unsearchable), and change.created
#          only reopens an abandoned change (a late "opened" no longer undoes a merge).
#          v1.3.0 adds completeness keywords for paraphrases ("lack", "nobody", "uncovered") and makes
#          Release and TestCase seed types (so "changes in release v1.4.0" and "test_retry" seed a query).
#          v1.4.0 links a deployment to the merged change whose merge_sha it deployed (GitHub deployments
#          name a commit, not PRs, so change_numbers is empty and no DEPLOYS edge was drawn).
# Loaded by context_graph.ontology (ADR-0018); this file is the source of truth, and
# docs/research/2026-10/ontology/pdlc.pack.yaml is kept identical to it.
# Format note: YAML 1.1 parsers read bare on/off/yes/no as booleans, so rule keys use `event:` not `on:`.
# The pack loader must parse with a YAML 1.2 or safe loader and reject non-string keys.

pack:
  name: pdlc
  version: 1.6.0   # 1.6.0: shared interfaces and provenance move to core 1.1.0; lifecycles name their superseded states (minor: additive).
                   # 1.5.0: REVERTS also read from GitHub's revert forms (minor: mapping, an added rule part).
                   # 1.4.0: DEPLOYS from a deployment to the change whose merge_sha it deployed (minor: mapping).
                   # 1.3.0: completeness paraphrase keywords; Release and TestCase are seed types (minor: additive).
                   # 1.2.0: intent keywords; change.merged sets title/body/files (minor: additive).
                   # 1.1.0: rules for events the webhook adapters emit (minor: additive rules only).
                   # 1.0.2: every type Sourced; OWNED_BY from Incident (patch: the pack's own notes promised both).
                   # 1.0.1: content_hash declared on Constraint and Lesson (patch: the key field was undeclared).
                   # 1.0.0: frozen for sign-off; no type or edge changes from 0.4.
                   # 0.4: 0.4: changes from mapping OpenDAL, Kafka and GitLab samples (mapping-step2.md).
                   # 0.3: 0.3: four edges and five fields added from the competency-question check (competency-questions.yaml).
                   # 0.2: names verified against CDEvents and OSLC vocabularies; trace-link, supersession and trust rules from the R10/R4/R8 briefs
  requires: [core>=1.1]          # Event, Entity, DERIVED_FROM, SUPERSEDES, CONTRADICTS, REFERENCES, CAUSED_BY, SAME_AS; the shared interfaces
  owner: TBD                     # decision 4 in the design doc
  description: Requests, specs, requirements, decisions, work, changes, verification, deployment and operations.

# Interfaces: Lifecycled, Anchored, Versioned, Claim and Sourced come from core (core 1.1.0);
# every PDLC type is Sourced. Owned stays here: it promises OWNED_BY, a PDLC edge.
interfaces:
  Owned:       {edges: [OWNED_BY]}

types:
  nodes:
    Request:
      key: [source_system, external_id]
      interfaces: [Lifecycled, Owned, Sourced]
      properties: {title: string, description: text, source_system: string, external_id: string, priority: string}
      lifecycle: {initial: new, states: [new, triaged, accepted, rejected, done]}
      text_fields: [title, description]
      embed_fields: [title, description]        # CQ03 similar past requests
    Spec:
      key: [doc_id, version]
      interfaces: [Lifecycled, Anchored, Versioned, Sourced]
      properties: {doc_id: string, title: string, acceptance_criteria: text, scope: text}
      lifecycle: {initial: draft, states: [draft, approved, superseded], superseded_states: [superseded]}
      text_fields: [title, acceptance_criteria, scope]
      embed_fields: [title, acceptance_criteria]
    Requirement:
      key: [spec_id, local_id]
      interfaces: [Lifecycled, Anchored, Sourced]
      properties: {spec_id: string, local_id: string, statement: text, priority: string}
      lifecycle: {initial: proposed, states: [proposed, accepted, implemented, verified, retired]}
      text_fields: [statement]
      embed_fields: [statement]
    Decision:
      key: [content_hash]
      interfaces: [Lifecycled, Anchored, Claim, Sourced]
      properties: {statement: text, rationale: text, alternatives: text, decided_at: datetime, valid_from: datetime, valid_to: datetime}
      lifecycle: {initial: proposed, states: [proposed, accepted, superseded, reversed], superseded_states: [superseded, reversed]}
      text_fields: [statement, rationale]
      embed_fields: [statement]
    Constraint:
      key: [content_hash]
      interfaces: [Lifecycled, Claim, Sourced]
      properties: {statement: text, scope: string, severity: string, content_hash: string}
      lifecycle: {initial: active, states: [active, relaxed, retired]}
      text_fields: [statement]
      embed_fields: [statement]
    DesignElement:
      key: [doc_id, section_path]
      interfaces: [Lifecycled, Anchored, Versioned, Sourced]
      properties: {doc_id: string, section_path: string, kind: {enum: [hld, lld]}, title: string, body: text}
      lifecycle: {initial: draft, states: [draft, reviewed, approved, superseded], superseded_states: [superseded]}
      text_fields: [title, body]
      embed_fields: [title, body]
    WorkItem:
      key: [tracker, external_key]
      interfaces: [Lifecycled, Owned, Sourced]
      properties: {tracker: string, external_key: string, title: string, work_type: {enum: [epic, story, task, bug, production_change]}, criticality: string, priority: string, labels: "list<string>", milestone: string, assignees: "list<string>", resolution: string}
      lifecycle: {initial: open, states: [open, in_progress, done, cancelled]}
      text_fields: [title]
    Change:
      key: [repo, number]
      interfaces: [Lifecycled, Anchored, Sourced]
      properties: {repo: string, number: int, title: string, body: text, head_sha: string, merge_sha: string, files: "list<string>", ticket_exempt: bool, change_type: string, scope: string}   # ticket_exempt: Kafka 'MINOR:' convention (39% of commits); change_type/scope: conventional-commit prefix (96% of OpenDAL commits)
      lifecycle: {initial: open, states: [open, reviewed, merged, abandoned]}
      text_fields: [title, body]
      embed_fields: [title, body]               # CQ26 have we tried this fix before
    Review:
      key: [repo, number, review_id]
      interfaces: [Sourced]
      properties: {repo: string, number: int, review_id: string, verdict: {enum: [commented, approved, changes_requested]}}
    TestCase:
      key: [repo, test_id]
      interfaces: [Lifecycled, Sourced]
      properties: {repo: string, test_id: string, path: string, name: string}
      lifecycle: {initial: active, states: [active, quarantined, retired]}
    TestRun:
      key: [run_id]
      interfaces: [Sourced]
      properties: {run_id: string, outcome: {enum: [success, failure, cancel, error, skipped]}, severity: {enum: [low, medium, high, critical]}, test_type: string, commit_sha: string, finished_at: datetime}
    Deployment:
      key: [environment, artifact_id, started_at]
      interfaces: [Lifecycled, Sourced]
      properties: {environment: string, artifact_id: string, started_at: datetime}
      lifecycle: {initial: started, states: [started, succeeded, failed, rolled_back]}
    Component:
      key: [catalog_name]
      interfaces: [Owned, Lifecycled, Sourced]
      properties: {catalog_name: string, kind: {enum: [service, library_module, binding, website, other]}, system: string, tier: string, repo: string, path_prefixes: "list<string>"}   # step 2: OpenDAL and Kafka have modules, not running services   # CQ14, CQ21 map files to a service
      lifecycle: {initial: production, states: [experimental, production, deprecated]}
    Release:
      key: [repo, version]
      interfaces: [Sourced]
      properties: {repo: string, version: string, released_at: datetime, breaking: bool}
      note: "step 2: a library ships by release, not deployment; OpenDAL's changelog lists 3,129 PR links across 154 releases"
    Incident:
      key: [incident_id]
      interfaces: [Lifecycled, Owned, Sourced]
      properties: {incident_id: string, severity: string, title: string, summary: text, environment: string, artifact_id: string, ticket_uri: string}
      lifecycle: {initial: detected, states: [detected, mitigated, resolved, postmortem_done]}
      text_fields: [title, summary]
      embed_fields: [title, summary]
    Team:
      key: [catalog_name]
      interfaces: [Sourced]
      properties: {catalog_name: string, display_name: string}
    Lesson:
      key: [content_hash]
      interfaces: [Claim, Lifecycled, Sourced]
      properties: {statement: text, polarity: {enum: [apply, avoid]}, support_count: int, content_hash: string}
      lifecycle: {initial: tentative, states: [tentative, validated, deprecated]}
      text_fields: [statement]
      embed_fields: [statement]

  edges:
    REFINES:         {from: [Spec, Requirement, DesignElement], to: [Request, Spec, Requirement], requires: [confidence, method, link_status]}
    DECOMPOSES_INTO: {from: [Spec, WorkItem], to: [WorkItem], properties: {order: int}}
    IMPLEMENTS:      {from: [Change, WorkItem], to: [WorkItem, Requirement, DesignElement], requires: [confidence, method, link_status]}
    VERIFIES:        {from: [TestCase], to: [Requirement, Spec, Change, WorkItem], requires: [confidence, method, link_status]}   # Spec: OpenDAL behaviour tests are the conformance suite for its specs
    EXECUTES:        {from: [TestRun], to: [TestCase]}
    RAN_AGAINST:     {from: [TestRun], to: [Change], properties: {commit_sha: string}}
    REVIEWS:         {from: [Review], to: [Change]}
    DEPLOYS:         {from: [Deployment], to: [Change, Release]}
    INCLUDES:        {from: [Release], to: [Change], properties: {section: {enum: [breaking, added, fixed, docs, ci, other]}}, note: "declared by changelogs"}
    DEPLOYED_TO:     {from: [Deployment], to: [Component], properties: {environment: string}}
    DECIDED_BY:      {from: [Decision, Constraint], to: ["core:Entity"]}                       # CQ30 who relaxed a constraint
    APPLIES_TO:      {from: [Decision], to: [Component, Requirement, DesignElement, Change], requires: [confidence, method, link_status]}   # CQ01, CQ02, CQ08, CQ13, CQ15: the scope of a decision
    CITES:           {from: [Spec, Change], to: [Decision, Constraint, DesignElement, Lesson, Requirement], properties: {pinned_position: string}}   # CQ04, CQ28: knowledge by reference, pinned to a ledger position
    TOUCHES:         {from: [Change], to: [Component], note: "derived: a changed file falls under one of the service's path_prefixes"}   # CQ14, CQ21
    REVERTS:         {from: [Change], to: [Change], note: "declared: 'Revert \"…\"' / 'This reverts #n' in the PR title or body"}       # CQ23, CQ26
    CONSTRAINS:      {from: [Constraint], to: [Requirement, DesignElement, Component, WorkItem], properties: {scope: string}}
    DEPENDS_ON:      {from: [WorkItem, Component], to: [WorkItem, Component], properties: {kind: {enum: [blocks, needs]}}}
    OWNED_BY:        {from: [Component, WorkItem, Request, Incident], to: [Team, "core:Entity"]}
    AFFECTS:         {from: [Incident], to: [Component], requires: [confidence, method, link_status]}   # GitLab names the service only in the incident title
    OCCURRED_ON:     {from: [Incident], to: [Deployment], note: "declared: CDEvents incident subject carries environment and artifactId"}
    ATTRIBUTED_TO:   {from: [Incident], to: [Change, WorkItem], requires: [confidence, method, link_status]}   # WorkItem: planned production changes (GitLab change issues)
    AMENDS:          {from: [Decision], to: [Decision], properties: {kind: {enum: [builds_on, updates, replaces_part]}}, requires: [confidence, method, link_status], note: "step 2: OpenDAL RFCs cite earlier RFCs with 'updates', 'builds on', 'changes'; none says 'supersedes'"}
    REMEDIATES:      {from: [Change], to: [Incident], requires: [confidence, method, link_status]}   # a related merge request may be the fix or the cause
    RAISES:          {from: [Incident], to: [Request]}
    LEARNED_FROM:    {from: [Lesson], to: [Incident, Change]}
  # Trace-link policy (BRIEF E-20261002-01-r2): a confidence cut-off at write time left about 1 trail in 3 intact in the
  # source study, and the confidence was never calibrated. So links are never dropped at write time.
  link_policy:
    applies_to: [REFINES, IMPLEMENTS, VERIFIES, ATTRIBUTED_TO, APPLIES_TO, AMENDS, AFFECTS, REMEDIATES]
    link_status: {enum: [proposed, confirmed, rejected], declared_links_start_as: confirmed, inferred_links_start_as: proposed}
    write_time_threshold: none                     # store every proposed link with its score
    read_time_threshold: per_edge_type_fitted      # fitted on our own labelled data, per type (B14)
    scoring_question: yes_no                       # score inferred links with a yes/no question, not a 5-band scale (ordinal-scale finding)
    completeness_reports: [no_link, proposed_only, confirmed]   # "no test" and "only an unconfirmed test link" are different answers
  # Core edges this pack extends to its own types (endpoint additions only):
  extends_core_edges:
    SUPERSEDES:   {from: [Decision, Spec, DesignElement], to: [Decision, Spec, DesignElement]}
    CONTRADICTS:  {from: [Decision, Constraint], to: [Decision, Constraint]}
    REFERENCES:   {from: ["core:Event"], to: "*", note: "agent sessions link to the PDLC artifacts they touched (role object|result)"}
    SAME_AS:      {from: [WorkItem, Component], to: [WorkItem, Component], note: "cross-tool identity, e.g. GitHub issue == Jira ticket"}

events:
  # Tool events follow CDEvents; the original type is kept in payload.cdevents_type.
  pdlc.change.created:        {aliases: {cdevents: dev.cdevents.change.created}}
  pdlc.change.reviewed:       {aliases: {cdevents: dev.cdevents.change.reviewed}}
  pdlc.change.merged:         {aliases: {cdevents: dev.cdevents.change.merged}}
  pdlc.change.abandoned:      {aliases: {cdevents: dev.cdevents.change.abandoned}}
  pdlc.change.updated:        {aliases: {cdevents: dev.cdevents.change.updated}}
  pdlc.change.committed:      {note: "git-only fallback when no PR webhook is available"}
  pdlc.release.published:     {aliases: {cdevents: dev.cdevents.artifact.published}}
  pdlc.testcaserun.finished:  {aliases: {cdevents: dev.cdevents.testcaserun.finished}}
  pdlc.testcaserun.skipped:   {aliases: {cdevents: dev.cdevents.testcaserun.skipped}}
  pdlc.service.deployed:      {aliases: {cdevents: dev.cdevents.service.deployed}}
  pdlc.service.rolledback:    {aliases: {cdevents: dev.cdevents.service.rolledback}}
  pdlc.service.upgraded:      {aliases: {cdevents: dev.cdevents.service.upgraded}}
  pdlc.incident.detected:     {aliases: {cdevents: dev.cdevents.incident.detected}}
  pdlc.incident.resolved:     {aliases: {cdevents: dev.cdevents.incident.resolved}}
  pdlc.incident.reported:     {aliases: {cdevents: dev.cdevents.incident.reported}}
  pdlc.ticket.created:        {aliases: {cdevents: dev.cdevents.ticket.created}}
  pdlc.ticket.updated:        {aliases: {cdevents: dev.cdevents.ticket.updated}}
  pdlc.ticket.closed:         {aliases: {cdevents: dev.cdevents.ticket.closed}}
  # Intake events: CDEvents stops at the code boundary, so these are Engram's own.
  pdlc.request.created:       {}
  pdlc.spec.approved:         {}
  pdlc.requirement.changed:   {}
  pdlc.design.section_changed: {}
  pdlc.decision.recorded:     {}

# Deterministic projection: event -> node upserts -> edge upserts -> lifecycle transitions.
# $.x reads the event payload; $event.x reads the envelope. Unknown references fail validation at pack load.
projection:
  - event: pdlc.change.created
    upsert:
      - {type: Change, key: {repo: $.repo, number: $.number}, set: {title: $.title, body: $.body, head_sha: $.head_sha, files: $.files}}
    transition: {type: Change, to: open, only_from: [abandoned]}   # a reopen; a late or replayed "opened" never undoes a merge
  - event: pdlc.change.merged
    upsert:
      - {type: Change, key: {repo: $.repo, number: $.number}, set: {merge_sha: $.merge_sha, title: $.title, body: $.body, files: $.files}}
    transition: {type: Change, to: merged}
    edges:
      - type: IMPLEMENTS
        from: {type: Change, key: {repo: $.repo, number: $.number}}
        to_each: {type: WorkItem, key: {tracker: jira, external_key: "regex($.body, '(?i)(?:fixes|closes|resolves)\\s+([A-Z][A-Z0-9]+-\\d+)')"}}
        set: {confidence: 1.0, method: declared, link_status: confirmed}
      - type: REVERTS
        from: {type: Change, key: {repo: $.repo, number: $.number}}
        to_each: {type: Change, key: {repo: $.repo, number: "regex($.title + ' ' + $.body, '(?i)(?:revert(?:s)?\\s+#|this reverts #)(\\d+)')"}}
      - type: REVERTS                       # GitHub's forms: the revert button's "Reverts owner/repo#N", and git's
        from: {type: Change, key: {repo: $.repo, number: $.number}}   # 'Revert "<title> (#N)"' for a squash-merged PR
        to_each: {type: Change, key: {repo: $.repo, number: "regex_all($.title + ' ' + $.body, '(?i)(?:\\brevert\\s+\"[^\"\\n]*\\(#|\\breverts\\s+[\\w.-]+/[\\w.-]+#)(\\d+)')"}}
      - type: TOUCHES
        from: {type: Change, key: {repo: $.repo, number: $.number}}
        to_each: {type: Component, match_any_prefix: {repo: $.repo, path_prefixes: $.files}}
  - event: pdlc.change.committed            # git-only sources (no PR webhook): derive what the commit message declares
    upsert:
      - {type: Change, key: {repo: $.repo, number: "regex($.subject, '\\(#(\\d+)\\)$')"}, set: {title: $.subject, files: $.files, change_type: "regex($.subject, '^(\\w+)')", scope: "regex($.subject, '^\\w+\\(([^)]+)\\)')", ticket_exempt: "match($.subject, '(?i)^MINOR')"}}
      - {type: Review, key: {repo: $.repo, number: "regex($.subject, '\\(#(\\d+)\\)$')", review_id: "each(regex_all($.body, '(?im)^reviewers?:\\s*(.+)$'))"}, set: {verdict: approved}}
    edges:
      - {type: IMPLEMENTS, from: {type: Change, key: {repo: $.repo, number: "regex($.subject, '\\(#(\\d+)\\)$')"}}, to_each: {type: WorkItem, key: {tracker: jira, external_key: "regex_all($.subject + ' ' + $.body, '([A-Z][A-Z0-9]+-\\d+)')"}}, set: {confidence: 1.0, method: declared, link_status: confirmed}}
  - event: pdlc.release.published
    upsert:
      - {type: Release, key: {repo: $.repo, version: $.version}, set: {released_at: $event.occurred_at, breaking: $.has_breaking}}
    edges:
      - {type: INCLUDES, from: {type: Release, key: {repo: $.repo, version: $.version}}, to_each: {type: Change, key: {repo: $.repo, number: "$.entries[*].pr_number"}}, set: {section: "$.entries[*].section"}}
  - event: pdlc.change.reviewed
    upsert:
      - {type: Review, key: {repo: $.repo, number: $.number, review_id: $.review_id}, set: {verdict: $.verdict}}
    edges:
      - {type: REVIEWS, from: {type: Review, key: {repo: $.repo, number: $.number, review_id: $.review_id}}, to: {type: Change, key: {repo: $.repo, number: $.number}}}
    transition: {type: Change, to: reviewed, only_from: [open]}
  - event: pdlc.testcaserun.finished
    upsert:
      - {type: TestCase, key: {repo: $.repo, test_id: $.test_id}, set: {path: $.path, name: $.name}}
      - {type: TestRun, key: {run_id: $.run_id}, set: {outcome: $.outcome, commit_sha: $.commit_sha, finished_at: $event.occurred_at}}
    edges:
      - {type: EXECUTES, from: {type: TestRun, key: {run_id: $.run_id}}, to: {type: TestCase, key: {repo: $.repo, test_id: $.test_id}}}
      - {type: RAN_AGAINST, from: {type: TestRun, key: {run_id: $.run_id}}, to: {type: Change, key: {repo: $.repo, number: $.change_number}}, when: $.change_number}
  - event: pdlc.service.deployed
    upsert:
      - {type: Component, key: {catalog_name: $.service}}
      - {type: Deployment, key: {environment: $.environment, artifact_id: $.artifact_id, started_at: $event.occurred_at}}
    transition: {type: Deployment, to: succeeded}
    edges:
      - {type: DEPLOYED_TO, from: {type: Deployment, key: {environment: $.environment, artifact_id: $.artifact_id, started_at: $event.occurred_at}}, to: {type: Component, key: {catalog_name: $.service}}, set: {environment: $.environment}}
      - {type: DEPLOYS, from: {type: Deployment, key: {environment: $.environment, artifact_id: $.artifact_id, started_at: $event.occurred_at}}, to_each: {type: Change, key: {repo: $.repo, number: "$.change_numbers[*]"}}}
      # A deployed commit is the merge commit of a change: link it (only changes merged before the deployment is projected)
      - {type: DEPLOYS, from: {type: Deployment, key: {environment: $.environment, artifact_id: $.artifact_id, started_at: $event.occurred_at}}, to_each: {type: Change, match: {repo: $.repo, merge_sha: $.artifact_id}}, when: $.artifact_id}
  - event: pdlc.incident.detected
    upsert:
      - {type: Incident, key: {incident_id: $.incident_id}, set: {severity: $.severity, title: $.description, environment: $.environment, artifact_id: $.artifact_id}}
      - {type: Component, key: {catalog_name: $.service}}
    transition: {type: Incident, to: detected}
    edges:
      - {type: AFFECTS, from: {type: Incident, key: {incident_id: $.incident_id}}, to: {type: Component, key: {catalog_name: $.service}}}
      - {type: OCCURRED_ON, from: {type: Incident, key: {incident_id: $.incident_id}}, to_latest: {type: Deployment, match: {environment: $.environment, artifact_id: $.artifact_id}}, when: $.artifact_id}
  - event: pdlc.ticket.updated
    upsert:
      - {type: WorkItem, key: {tracker: $.tracker, external_key: $.key}, set: {title: $.title, work_type: $.work_type}}
    transition: {type: WorkItem, to: "map($.status, {'To Do': open, 'In Progress': in_progress, 'Done': done, 'Won''t Do': cancelled})"}
    edges:
      - {type: DECOMPOSES_INTO, from: {type: WorkItem, key: {tracker: $.tracker, external_key: $.parent_key}}, to: {type: WorkItem, key: {tracker: $.tracker, external_key: $.key}}, when: $.parent_key}
  # 1.1.0: the rest of the ticket, change and incident lifecycle the webhook adapters emit
  - event: pdlc.ticket.created
    upsert:
      - {type: WorkItem, key: {tracker: $.tracker, external_key: $.key}, set: {title: $.title, work_type: $.work_type}}
    transition: {type: WorkItem, to: "map($.status, {'To Do': open, 'In Progress': in_progress, 'Done': done, 'Won''t Do': cancelled})"}
    edges:
      - {type: DECOMPOSES_INTO, from: {type: WorkItem, key: {tracker: $.tracker, external_key: $.parent_key}}, to: {type: WorkItem, key: {tracker: $.tracker, external_key: $.key}}, when: $.parent_key}
  - event: pdlc.ticket.closed
    upsert:
      - {type: WorkItem, key: {tracker: $.tracker, external_key: $.key}, set: {title: $.title, resolution: $.resolution}}
    transition: {type: WorkItem, to: "map($.status, {'Done': done, 'Won''t Do': cancelled})"}
  - event: pdlc.change.updated
    upsert:
      - {type: Change, key: {repo: $.repo, number: $.number}, set: {title: $.title, body: $.body, head_sha: $.head_sha}}
  - event: pdlc.change.abandoned
    upsert:
      - {type: Change, key: {repo: $.repo, number: $.number}, set: {title: $.title}}
    transition: {type: Change, to: abandoned, only_from: [open, reviewed]}
  - event: pdlc.incident.resolved
    upsert:
      - {type: Incident, key: {incident_id: $.incident_id}, set: {summary: $.summary}}
    transition: {type: Incident, to: resolved}
  - event: pdlc.spec.approved
    upsert:
      - {type: Spec, key: {doc_id: $.doc_id, version: $.version}, set: {title: $.title, acceptance_criteria: $.acceptance_criteria, scope: $.scope, source_uri: $.source_uri, content_hash: $.content_hash}}
    transition: {type: Spec, to: approved}
    edges:
      - {type: REFINES, from: {type: Spec, key: {doc_id: $.doc_id, version: $.version}}, to_each: {type: Request, key: {source_system: $.request_system, external_id: "$.request_ids[*]"}}, set: {confidence: 1.0, method: declared, link_status: confirmed}}
      - {type: CITES, from: {type: Spec, key: {doc_id: $.doc_id, version: $.version}}, to_each: {node_id: "$.cited_node_ids[*]"}, set: {pinned_position: $event.global_position}}
  - event: pdlc.decision.recorded
    upsert:
      - {type: Decision, key: {content_hash: "sha256($.statement)"}, set: {statement: $.statement, rationale: $.rationale, source_uri: $.source_uri, content_hash: "sha256($.statement)"}}
    transition: {type: Decision, to: accepted}
    edges:
      - {type: SUPERSEDES, from: {type: Decision, key: {content_hash: "sha256($.statement)"}}, to: {type: Decision, key: {content_hash: $.supersedes_hash}}, when: $.supersedes_hash}
      - {type: APPLIES_TO, from: {type: Decision, key: {content_hash: "sha256($.statement)"}}, to_each: {node_id: "$.applies_to_node_ids[*]"}, set: {confidence: 1.0, method: declared, link_status: confirmed}, when: $.applies_to_node_ids}
  # Every rule implicitly adds DERIVED_FROM from each upserted node to the triggering Event (provenance),
  # and sets source_trust from the emitting source's allowlist entry.

# LLM extraction: only for prose. The generated prompt lists these types with descriptions and examples,
# and the generated output schema accepts only them.
extraction:
  sources: [pdlc.design.section_changed, pdlc.spec.approved, "core:observation.input"]
  propose:
    Decision:   {description: "A choice that was made, with its rationale, e.g. 'We will use idempotency keys on refund retries because…'", max_confidence: 0.8}
    Constraint: {description: "A rule that limits future work, e.g. 'Refunds must never exceed the captured amount'", max_confidence: 0.8}
    Lesson:     {description: "Something learned from an outcome, phrased as apply or avoid", max_confidence: 0.6}
    IMPLEMENTS: {description: "An undeclared link from a change to the requirement it serves", method: inferred, max_confidence: 0.7, link_status: proposed, scoring_question: "Does this change implement this requirement? yes/no"}
    AMENDS:     {description: "How a decision changes an earlier one: builds on it, updates part of it, or replaces part of it", method: inferred, link_status: proposed, scoring_question: "Does decision A change decision B? yes/no; then: builds_on, updates or replaces_part"}
    APPLIES_TO: {description: "Which service, requirement, design section or change a decision is about", method: inferred, link_status: proposed, scoring_question: "Is this decision about this item? yes/no"}
    VERIFIES:   {description: "An undeclared link from a test to the requirement it checks", method: inferred, link_status: proposed, scoring_question: "Does this test check this requirement? yes/no"}
  never_propose: [Change, TestRun, Deployment, Incident, WorkItem, Release]
  derived_proposals:
    VERIFIES: {rule: "a test file changed in the same commit as the change", confidence: 0.3, method: co_change, link_status: proposed}   # Kafka 74%, OpenDAL 14% of commits change tests too   # these come only from tool events

retrieval:
  seed_types: [Requirement, Decision, Constraint, Change, Component, Incident, WorkItem, Spec, DesignElement, Lesson, Release, TestCase]
  intents:
    trace:
      description: "Follow a requirement or request through design, code, tests and deployment"
      examples: ["where is PAY-341 deployed", "trace the refund retry requirement", "what implements REQ-12"]
      keywords: [trace, deployed, implements, implemented, delivered, deliver, shipped, ship, release]
      weights: {REFINES: 5, IMPLEMENTS: 5, VERIFIES: 4, DEPLOYS: 4, DEPLOYED_TO: 3, DECOMPOSES_INTO: 3, INCLUDES: 4}
      max_depth: 5
    completeness:
      description: "Find artifacts missing an expected link (requirement without test, change without review)"
      examples: ["which requirements have no tests", "unreviewed merges last week"]
      keywords: [missing, without, no tests, no test, untested, unreviewed, unlinked, not linked, have no, has no, lack, lacks, lacking, nobody, uncovered, no review, no reviews]
      weights: {VERIFIES: 5, IMPLEMENTS: 5, REVIEWS: 4, REFINES: 3}
      plugin: missing_links      # set difference is not a traversal; served by a query plugin
    status:
      description: "Current, non-superseded state of a decision, spec or design"
      examples: ["is the idempotency decision still current", "latest version of the refunds HLD"]
      keywords: [still, current, latest, valid, superseded, replaced, reversed, amended, contradict, contradicts, approved version]
      weights: {SUPERSEDES: 5, AMENDS: 4, CONTRADICTS: 4, DECIDED_BY: 2, APPLIES_TO: 3, CITES: 4}
      prefer_types: [Spec]   # step 2: OpenDAL specs, not the latest RFC, state the current contract
    impact:
      description: "What is affected if this changes"
      examples: ["what depends on the ledger service", "what breaks if we change the refunds API"]
      keywords: [depends, depend, dependent, affected, impact, breaks, break, blast radius]
      weights: {DEPENDS_ON: 5, CONSTRAINS: 4, AFFECTS: 3, OWNED_BY: 2}
      direction: inbound
    preflight:
      description: "Before acting on an artifact, surface lessons, open incidents, failing tests and constraints"
      examples: ["anything I should know before editing refund/retry.py"]
      keywords: [before i, should know, before editing, before i edit, lessons, risks, warnings, gotchas]
      weights: {LEARNED_FROM: 5, AFFECTS: 4, CONSTRAINS: 5, RAN_AGAINST: 3, ATTRIBUTED_TO: 3, TOUCHES: 5, APPLIES_TO: 4, REVERTS: 4}
  admission:                      # what may reach the agent's context (BRIEF E-20261004-02, B11)
    superseded_or_reversed: {default: exclude, include_for_intents: [status, why], label_as: superseded}
    untrusted_uncorroborated: {default: exclude_from_action_context, available_via: lookup_untrusted}
    proposed_links: {default: show_with_confidence, never_counted_as: confirmed}
  core_intent_weights:            # additions to core intents when this pack is active
    why: {IMPLEMENTS: 4, REFINES: 4, DECIDED_BY: 3, ATTRIBUTED_TO: 3, RAISES: 3, APPLIES_TO: 4, CITES: 3}
    who_is: {OWNED_BY: 5, DECIDED_BY: 4}

lifecycle:
  decay:
    Constraint: {class: pinned, compressible: false}       # never summarised away (Governance Decay, AuthMem-Bench)
    Decision:   {class: slow}
    Requirement: {class: slow}
    TestRun:    {class: fast, retain_days: 30}
    Review:     {class: medium}
    default:    {class: medium}
  terminal_states_reduce_importance: [retired, cancelled, abandoned, deprecated, superseded]

mappings:
  prov:
    Change: prov:Entity
    TestRun: prov:Activity
    Deployment: prov:Activity
    Decision: prov:Entity
    DECIDED_BY: prov:wasAttributedTo
    SUPERSEDES: prov:wasRevisionOf
  oslc:
    Requirement: oslc_rm:Requirement
    Spec: oslc_rm:RequirementCollection
    WorkItem: oslc_cm:ChangeRequest
    TestCase: oslc_qm:TestCase
    TestRun: oslc_qm:TestResult
    IMPLEMENTS: "oslc_cm:implementsRequirement (WorkItem->Requirement); inverse of oslc_cm:tracksChangeSet (Change->WorkItem)"
    VERIFIES: "oslc_qm:validatesRequirement (->Requirement); oslc_qm:testsChangeRequest (->WorkItem)"
    EXECUTES: oslc_qm:reportsOnTestCase
    DECOMPOSES_INTO: "inverse of oslc_cm:parent"
  backstage:
    Component: Component
    Team: Group
    OWNED_BY: ownedBy
    DEPENDS_ON: dependsOn
  essence:
    Request: Opportunity
    Requirement: Requirements
    Component: SoftwareSystem   # Essence
    Team: Team
    WorkItem: Work
  synonyms:                       # SKOS-style altLabels for entity resolution and the extraction prompt
    Change: [pull request, PR, merge request, MR, changeset]
    WorkItem: [ticket, issue, story, task, bug]
    Incident: [outage, sev, page]
    Decision: [ADR, architecture decision]
