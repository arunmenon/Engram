<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Engram Interactive Visual Study Book</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-soft: #f1f5f9;
    --ink: #0f172a;
    --ink-body: #1e293b;
    --ink-muted: #475569;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --blue-border: #bfdbfe;

    --green: #059669;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;

    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
    --purple-border: #ddd6fe;

    --amber: #d97706;
    --amber-bg: #fffbeb;
    --amber-border: #fde68a;

    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;

    --shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 12px -2px rgba(15, 23, 42, 0.03);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.7;
    font-size: 16.5px;
  }

  /* Two-column layout: Left Curriculum Sidebar + Spacious Main Book Area */
  .book-layout {
    display: grid;
    grid-template-columns: 310px 1fr;
    min-height: 100vh;
  }
  .nav-toggle { display: none; margin-left: auto; appearance: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }

  /* Left Curriculum Sidebar */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px 48px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .brand-badge {
    background: var(--blue);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 8px;
    letter-spacing: 0.04em;
  }
  .brand-title {
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    line-height: 1.2;
  }

  .mod-group {
    margin-bottom: 20px;
  }
  .mod-header {
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-muted);
    padding: 4px 10px;
    margin-bottom: 6px;
  }
  .lesson-link {
    width: 100%;
    text-align: left;
    appearance: none;
    border: none;
    background: transparent;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-muted);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    transition: all 0.15s ease;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .lesson-link:hover {
    background: var(--surface-soft);
    color: var(--ink);
  }
  .lesson-link.active {
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 700;
  }
  .lesson-num {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.75;
    min-width: 28px;
    padding-top: 1px;
  }

  /* Spacious Main Reading & Visual Stage */
  .lesson-main {
    padding: 40px 56px 96px;
    max-width: 1080px;
    margin: 0 auto;
    width: 100%;
  }
  @media (max-width: 768px) {
    .lesson-main { padding: 24px 20px 64px; }
  }

  /* Top Lesson Navigation Bar */
  .lesson-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .mod-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--blue-bg);
    color: var(--blue);
  }
  .top-Controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-btn {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--blue);
    color: var(--blue);
  }
  .page-btn.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
  }
  .page-btn.primary:hover:not(:disabled) {
    background: #1d4ed8;
    color: #fff;
  }
  .page-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* Lesson Typography */
  .lesson-title {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.2;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .lesson-hook {
    font-size: 19px;
    color: var(--ink-body);
    margin: 0 0 32px;
    line-height: 1.65;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 5px solid var(--blue);
    padding: 20px 24px;
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  /* Section Blocks inside a Lesson (Generous Vertical Breathing Room) */
  .section-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }
  .section-block h2 {
    margin: 0 0 14px;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .section-block p {
    margin: 0 0 18px;
    color: var(--ink-body);
    font-size: 16.5px;
  }
  .section-block p:last-child {
    margin-bottom: 0;
  }

  /* Interactive Visual Stage inside a Lesson */
  .anim-box {
    background: #f8fafc;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 24px;
    margin: 24px 0;
  }
  .anim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .anim-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .anim-tab {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink-muted);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .anim-tab:hover {
    border-color: var(--blue);
    color: var(--blue);
  }
  .anim-tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.25);
  }
  .step-next-btn {
    appearance: none;
    border: 1px solid var(--green);
    background: var(--green-bg);
    color: var(--green);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .step-next-btn:hover {
    background: var(--green);
    color: #fff;
  }

  .anim-narration {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--blue);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 18px;
    font-size: 16px;
    color: var(--ink-body);
  }

  .svg-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    overflow-x: auto;
  }
  .svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Plain-English Term Cards (Zero Unexplained Jargon) */
  .concept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin: 20px 0;
  }
  .concept-card {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }
  .concept-card.blue { background: var(--blue-bg); border-color: var(--blue-border); }
  .concept-card.green { background: var(--green-bg); border-color: var(--green-border); }
  .concept-card.purple { background: var(--purple-bg); border-color: var(--purple-border); }
  .concept-card.amber { background: var(--amber-bg); border-color: var(--amber-border); }
  .concept-card.red { background: var(--red-bg); border-color: var(--red-border); }

  .concept-card h3 {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
  }
  .concept-card p {
    margin: 0;
    font-size: 15.5px;
    color: var(--ink-body);
  }

  /* Bottom Next/Prev Lesson Banner */
  .bottom-pager {
    margin-top: 40px;
    padding-top: 28px;
    border-top: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  /* Animations */
  @keyframes dashFlow {
    to { stroke-dashoffset: -28; }
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(37, 99, 235, 0)); }
    50% { filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.4)); }
  }
  .flow-line {
    stroke-dasharray: 8 6;
    animation: dashFlow 0.9s linear infinite;
  }
  .pulse-box {
    animation: pulseGlow 2.2s ease-in-out infinite;
  }

  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    background: #e2e8f0;
    padding: 2px 7px;
    border-radius: 6px;
    color: #0f172a;
  }

  /* Step-through visual engine */
  .anim-title { font-weight: 800; font-size: 15.5px; color: var(--ink); margin: 0 0 14px; }
  .anim-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .ctl-btn {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
    padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .ctl-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
  .ctl-btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .ctl-btn.primary:hover:not(:disabled) { background: #1d4ed8; color: #fff; }
  .ctl-btn.play { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .ctl-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .step-counter { font-size: 13.5px; font-weight: 700; color: var(--ink-muted); }
  .step-dots { display: flex; gap: 6px; flex: 1; min-width: 40px; }
  .step-dots .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); transition: background 0.3s; }
  .step-dots .dot.on { background: var(--blue); }

  svg [data-step], svg [data-until], svg [data-focus] {
    transition: opacity 0.45s ease, transform 0.45s ease, filter 0.3s ease;
    transform-box: fill-box;
    transform-origin: center;
  }
  svg .is-hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }
  svg .is-focus { filter: drop-shadow(0 0 9px rgba(37, 99, 235, 0.45)); }
  .svg-wrap.fade-in svg { animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .pipeline-map { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -10px 0 22px; font-size: 12.5px; font-weight: 700; }
  .pipe-stage { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-muted); background: var(--surface); }
  .pipe-stage.current { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pipe-arrow { color: var(--border-strong); }

  .hood { margin-top: 20px; border: 1px dashed var(--border-strong); border-radius: 12px; padding: 10px 16px; background: var(--surface-soft); }
  .hood summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-muted); }
  .hood-body { margin-top: 10px; font-size: 14.5px; color: var(--ink-body); }
  .proof { border: 1px solid var(--border); border-left: 5px solid var(--amber, #d97706); border-radius: 12px; padding: 12px 18px; margin: 8px 0 18px; background: var(--surface); font-size: 14px; }
  .proof-full { border-left-color: #059669; }
  .proof-diagnostic { border-left-color: #dc2626; }
  .proof-external { border-left-color: #64748b; }
  .proof-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .proof-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-muted); margin-right: 4px; }
  .proof-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface-soft); border: 1px solid var(--border); }
  .proof-verdict { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
  .proof-full .proof-verdict { background: #ecfdf5; color: #047857; border-color: #6ee7b7; }
  .proof-diagnostic .proof-verdict { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }
  .proof-external .proof-verdict { background: #f8fafc; color: #475569; border-color: #cbd5e1; }
  .proof-line { margin: 3px 0; color: var(--ink-body); }
  .proof-link { font-size: 13px; font-weight: 700; }
  .takeaway { background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 14px; padding: 18px 22px; margin: 8px 0 24px; }
  .takeaway-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--green); margin-bottom: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .flow-line, .pulse-box { animation: none; }
    svg [data-step], svg [data-until], svg [data-focus], .step-dots .dot { transition: none; }
    .svg-wrap.fade-in svg { animation: none; }
  }
  @media (max-width: 1024px) {
    .book-layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; top: auto; height: auto; overflow: visible; border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .nav-toggle { display: inline-block; }
    #sidebar-tree { display: none; }
    .sidebar.open #sidebar-tree { display: block; }
  }
</style>
</head>
<body>

<div class="book-layout">
  <!-- Left Curriculum Tree -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-badge">ENGRAM</span>
      <div class="brand-title">Interactive Study Book</div>
      <button class="nav-toggle" aria-expanded="false" onclick="toggleNav(this)">Lessons</button>
    </div>
    <div id="sidebar-tree"></div>
  </aside>

  <!-- Spacious Main Lesson View -->
  <main class="lesson-main">
    <div class="lesson-topbar">
      <div class="mod-pill" id="mod-pill">Module 1</div>
      <div class="top-Controls">
        <span id="lesson-progress" style="font-size:14px; font-weight:700; color:var(--ink-muted); margin-right:6px;"></span>
        <button class="page-btn" id="top-prev" onclick="prevLesson()">&larr; Previous</button>
        <button class="page-btn primary" id="top-next" onclick="nextLesson()">Next Lesson &rarr;</button>
      </div>
    </div>

    <nav class="pipeline-map" id="pipeline-map" hidden></nav>
    <h1 class="lesson-title" id="lesson-title"></h1>
    <div class="lesson-hook" id="lesson-hook"></div>

    <!-- Spacious Lesson Body -->
    <div id="lesson-body"></div>

    <!-- Bottom Lesson Pager -->
    <div class="bottom-pager">
      <button class="page-btn" id="bot-prev" onclick="prevLesson()">&larr; Previous Lesson</button>
      <button class="page-btn primary" id="bot-next" onclick="nextLesson()" style="padding: 12px 24px; font-size: 15.5px;">Next Lesson &rarr;</button>
    </div>
  </main>
</div>

<script>
/* =========================================================================
   LESSON CONTENT
   ========================================================================= */
/* =========================================================================
   SVG HELPERS for lesson visuals (viewBox width is always 880)
   Colours: blue = core, green = user, purple = memory, amber = pdlc,
            red = problem or blocked, grey = superseded or neutral, ink = plain.
   Every helper accepts step / until / focus (see the engine notes below).
   ========================================================================= */
const SVG_TONES = {
  blue:   { fill: '#eff6ff', stroke: '#2563eb', ink: '#1d4ed8' },
  green:  { fill: '#ecfdf5', stroke: '#059669', ink: '#047857' },
  purple: { fill: '#f5f3ff', stroke: '#7c3aed', ink: '#6d28d9' },
  amber:  { fill: '#fffbeb', stroke: '#d97706', ink: '#b45309' },
  red:    { fill: '#fef2f2', stroke: '#dc2626', ink: '#b91c1c' },
  grey:   { fill: '#f8fafc', stroke: '#94a3b8', ink: '#64748b' },
  ink:    { fill: '#ffffff', stroke: '#334155', ink: '#0f172a' },
};
const SVG_MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';

function esc(value) {
  return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function stepAttrs(options) {
  let attributes = '';
  if (options.step != null) attributes += ` data-step="${options.step}"`;
  if (options.until != null) attributes += ` data-until="${options.until}"`;
  if (options.focus != null) attributes += ` data-focus="${options.focus}"`;
  return attributes;
}

/* A node: rounded box with a bold title and up to two smaller lines. */
function svgBox(options) {
  const tone = SVG_TONES[options.tone || 'ink'];
  const height = options.h || 56;
  const subLines = [options.sub, options.sub2].filter(line => line != null && line !== '');
  const titleSize = options.titleSize || 14.5;
  const subSize = options.subSize || 12;
  const lineGap = subSize + 6;
  const blockHeight = titleSize + subLines.length * lineGap;
  const centerX = options.x + options.w / 2;
  let baseline = options.y + (height - blockHeight) / 2 + titleSize * 0.85;

  let markup = `<g${stepAttrs(options)}><rect x="${options.x}" y="${options.y}" width="${options.w}" height="${height}" rx="12"`
    + ` fill="${options.fill || tone.fill}" stroke="${tone.stroke}" stroke-width="${options.strong ? 3 : 2}"`
    + `${options.dashed ? ' stroke-dasharray="7 5"' : ''}/>`;
  if (options.title) {
    markup += `<text x="${centerX}" y="${baseline}" text-anchor="middle" font-weight="800" font-size="${titleSize}" fill="${tone.ink}"`
      + `${options.monoTitle ? ` font-family="${SVG_MONO}"` : ''}>${esc(options.title)}</text>`;
  }
  subLines.forEach(line => {
    baseline += lineGap;
    markup += `<text x="${centerX}" y="${baseline}" text-anchor="middle" font-size="${subSize}" fill="#475569"`
      + `${options.mono ? ` font-family="${SVG_MONO}"` : ''}>${esc(line)}</text>`;
  });
  return markup + '</g>';
}

/* A relationship: straight arrow that draws itself in, with an optional label. */
function svgArrow(options) {
  const toneName = options.tone || 'blue';
  const tone = SVG_TONES[toneName];
  const attributes = stepAttrs({ step: options.step, until: options.until });
  const className = options.noDraw ? (options.flow ? 'flow-line' : '') : 'draw';
  let markup = `<line${attributes}${className ? ` class="${className}"` : ''}${options.flow && !options.noDraw ? ' data-flow' : ''}`
    + ` x1="${options.x1}" y1="${options.y1}" x2="${options.x2}" y2="${options.y2}"`
    + ` stroke="${tone.stroke}" stroke-width="${options.width || 2.5}" stroke-linecap="round"`
    + `${options.dashed ? ' stroke-dasharray="6 5"' : ''}`
    + `${options.noHead ? '' : ` marker-end="url(#arrowhead-${toneName})"`}/>`;
  if (options.label) {
    const labelX = options.lx != null ? options.lx : (options.x1 + options.x2) / 2;
    const labelY = options.ly != null ? options.ly : (options.y1 + options.y2) / 2 - 8;
    markup += svgText({
      x: labelX, y: labelY, text: options.label, size: options.labelSize || 11.5, weight: 700,
      fill: tone.ink, anchor: options.anchor || 'middle', mono: true, halo: true,
      step: options.step, until: options.until,
    });
  }
  return markup;
}

/* A curved relationship (SVG path data in `d`). */
function svgCurve(options) {
  const toneName = options.tone || 'blue';
  const tone = SVG_TONES[toneName];
  const attributes = stepAttrs({ step: options.step, until: options.until });
  let markup = `<path${attributes} class="draw" d="${options.d}" fill="none" stroke="${tone.stroke}" stroke-width="${options.width || 2.5}"`
    + `${options.dashed ? ' stroke-dasharray="6 5"' : ''}${options.noHead ? '' : ` marker-end="url(#arrowhead-${toneName})"`}/>`;
  if (options.label) {
    markup += svgText({ x: options.lx, y: options.ly, text: options.label, size: 12, weight: 700, fill: tone.ink, mono: true, halo: true, step: options.step, until: options.until });
  }
  return markup;
}

function svgText(options) {
  const fontFamily = options.mono ? ` font-family="${SVG_MONO}"` : '';
  const halo = options.halo ? ' stroke="#ffffff" stroke-width="4" paint-order="stroke"' : '';
  return `<text${stepAttrs(options)} x="${options.x}" y="${options.y}" text-anchor="${options.anchor || 'middle'}"`
    + ` font-size="${options.size || 13}" font-weight="${options.weight || 600}" fill="${options.fill || '#0f172a'}"`

}

function svgRect(options) {
  return `<rect${stepAttrs(options)} x="${options.x}" y="${options.y}" width="${options.w}" height="${options.h}" rx="${options.rx != null ? options.rx : 12}"`
    + ` fill="${options.fill || 'none'}" stroke="${options.stroke || 'none'}" stroke-width="${options.width || 2}"`
    + `${options.dashed ? ' stroke-dasharray="7 5"' : ''}${options.opacity != null ? ` opacity="${options.opacity}"` : ''}/>`;
}

/* A soft marker drawn behind a path to show the route a question takes. */
function svgHighlight(options) {
  return `<line${stepAttrs(options)} class="draw" x1="${options.x1}" y1="${options.y1}" x2="${options.x2}" y2="${options.y2}"`
    + ` stroke="#fde68a" stroke-width="${options.width || 18}" stroke-linecap="round" opacity="0.9"/>`;
}

/* A point on a timeline. */
function svgDot(options) {
  const tone = SVG_TONES[options.tone || 'blue'];
  return `<circle${stepAttrs(options)} cx="${options.x}" cy="${options.y}" r="${options.r || 9}" fill="${tone.fill}" stroke="${tone.stroke}" stroke-width="3"/>`;
}

function svgFrame(height, ariaLabel, body) {
  const markers = Object.entries(SVG_TONES).map(([name, tone]) =>
    `<marker id="arrowhead-${name}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">`
    + `<path d="M0,0 L10,5 L0,10 z" fill="${tone.stroke}"/></marker>`).join('');
  return `<svg viewBox="0 0 880 ${height}" role="img" aria-label="${esc(ariaLabel)}"><defs>${markers}</defs>${body}</svg>`;
}

/* =========================================================================
   RENDER ENGINE

   Lesson fields:
     module, num, navTitle, title, hook        required
     stage        optional: ingest | ledger | workers | graph | retrieval (lights the pipeline map)
     takeaway     optional: question(s) the reader can now answer (HTML)
     proof        optional: pilot evidence chip { journeys, milestones, verdict, observed, boundary }
                  verdict is full | partial | diagnostic | external (from docs/pilot/coverage-map.md)
     sections     [{ heading, html, hood?, anim? }]
                  hood: HTML shown in a collapsed "Under the hood" panel
                  anim: a visual rendered right after this section
     anim         optional visual for the lesson; placed after section `animAfter` (default 0, -1 = before all sections)

   A visual ("anim") comes in two forms:
     Frames:      { title, frames: [{ tab, narration, svg }] }      one SVG per step, crossfaded
     Progressive: { title, svg, steps: [{ tab, narration }] }       one SVG built up step by step
       Inside a progressive SVG, any element may carry:
         data-step="k"    hidden until step k (0-based)
         data-until="k"   hidden after step k
         data-focus="k m" highlighted on steps k and m
         class="draw"     a line/path that draws itself in when revealed
         data-flow        keep the moving-dash effect after drawing in
   ========================================================================= */

  const tree = document.getElementById('sidebar-tree');

    group.items.push({ idx, num: lesson.num, navTitle: lesson.navTitle });

  tree.innerHTML = groups.map(group => `

      <div class="mod-header">${group.name}</div>

      `).join('')}
    </div>
  `).join('');
}

function renderPipelineMap(stage) {
  const mapElement = document.getElementById('pipeline-map');
  if (!stage) {
    mapElement.hidden = true;
    mapElement.innerHTML = '';
    return;
  }
  mapElement.hidden = false;
  mapElement.innerHTML = PIPELINE_STAGES.map((pipelineStage, idx) => `
    ${idx > 0 ? '<span class="pipe-arrow" aria-hidden="true">&rarr;</span>' : ''}
    <span class="pipe-stage ${pipelineStage.key === stage ? 'current' : ''}">${pipelineStage.label}</span>
  `).join('');
  mapElement.setAttribute('aria-label', `Pipeline position: ${stage}`);
}

function renderVisualHtml(visualIdx) {
  const { definition, step } = lessonVisuals[visualIdx];
  const totalSteps = stepCount(definition);
  const current = stepAt(definition, step);
  const svgMarkup = definition.svg || current.svg;
  const multiStep = totalSteps > 1;

  return `
    <figure class="anim-box" id="visual-${visualIdx}" data-visual="${visualIdx}">
      ${definition.title ? `<figcaption class="anim-title">${definition.title}</figcaption>` : ''}
      <div class="anim-header">
        <div class="anim-tabs" role="tablist">
          ${(definition.steps || definition.frames).map((item, idx) => `
            <button class="anim-tab ${idx === step ? 'active' : ''}" role="tab" aria-selected="${idx === step}"
              onclick="setVisualStep(${visualIdx}, ${idx}, true)">${item.tab}</button>
          `).join('')}
        </div>
      </div>
      <div class="anim-narration" aria-live="polite">${current.narration}</div>
      <div class="svg-wrap">${svgMarkup}</div>
      ${multiStep ? `
        <div class="anim-controls">
          <button class="ctl-btn" onclick="setVisualStep(${visualIdx}, ${step - 1}, true)" data-role="back" ${step === 0 ? 'disabled' : ''} aria-label="Previous step">&larr; Back</button>
          <button class="ctl-btn play" onclick="toggleAutoplay(${visualIdx})" data-role="play" aria-label="Play all steps">&#9654; Play</button>
          <span class="step-counter" data-role="counter">Step ${step + 1} of ${totalSteps}</span>
          <div class="step-dots" aria-hidden="true">
            ${Array.from({ length: totalSteps }, (_, idx) => `<span class="dot ${idx <= step ? 'on' : ''}"></span>`).join('')}
          </div>
          <button class="ctl-btn primary" onclick="setVisualStep(${visualIdx}, ${step + 1}, true)" data-role="next" ${step === totalSteps - 1 ? 'disabled' : ''} aria-label="Next step">Next step &rarr;</button>
        </div>` : ''}
    </figure>
  `;
}

const COVERAGE_MAP_URL = 'https://github.com/arunmenon/Engram/blob/feature/engram-memory-episodes/docs/pilot/coverage-map.md';

/* "Proven in the pilot" chip: what the pilot observed for this page's journeys and what it did not prove. */
function renderProofChip(proof) {
  return `<aside class="proof proof-${proof.verdict}">
    <div class="proof-head">
      <span class="proof-label">Proven in the pilot</span>
      <span class="proof-tag">${proof.journeys}</span>
      <span class="proof-tag">${proof.milestones}</span>
      <span class="proof-verdict">${proof.verdict}</span>
    </div>
    <p class="proof-line"><strong>Observed:</strong> ${proof.observed}</p>
    <p class="proof-line"><strong>Limit:</strong> ${proof.boundary}</p>
    <a class="proof-link" href="${COVERAGE_MAP_URL}" target="_blank" rel="noopener">Coverage map &rarr;</a>
  </aside>`;
}

function renderLesson() {
  const lesson = LESSONS[currentLessonIdx];
  stopAllAutoplay();
  lessonVisuals = [];
  activeVisualIdx = 0;

  document.getElementById('mod-pill').textContent = `${lesson.module} • Lesson ${lesson.num}`;
  document.getElementById('lesson-progress').textContent = `Lesson ${currentLessonIdx + 1} of ${LESSONS.length}`;
  document.getElementById('lesson-title').textContent = lesson.title;
  document.getElementById('lesson-hook').innerHTML = lesson.hook;
  renderPipelineMap(lesson.stage);

  const addVisual = (definition) => {
    lessonVisuals.push({ definition, step: 0, timer: null });
    return renderVisualHtml(lessonVisuals.length - 1);
  };

  let bodyHtml = '';
  const lessonVisualAfter = lesson.animAfter || 0;
  if (lessonVisualAfter === -1 && lesson.anim) bodyHtml += addVisual(lesson.anim);   // visual first, prose after
  lesson.sections.forEach((section, idx) => {
    bodyHtml += `
      <section class="section-block">
        <h2>${section.heading}</h2>
        ${section.html}
        ${section.hood ? `<details class="hood"><summary>Under the hood</summary><div class="hood-body">${section.hood}</div></details>` : ''}
      </section>
    `;
    if (section.anim) bodyHtml += addVisual(section.anim);
    if (idx === lessonVisualAfter && lesson.anim) bodyHtml += addVisual(lesson.anim);
  });
  if (lesson.proof) bodyHtml += renderProofChip(lesson.proof);
  if (lesson.takeaway) {
    bodyHtml += `<aside class="takeaway"><div class="takeaway-label">You can now answer</div>${lesson.takeaway}</aside>`;
  }
  document.getElementById('lesson-body').innerHTML = bodyHtml;
  lessonVisuals.forEach((_, idx) => applyProgressiveState(idx, false));

  const isFirst = currentLessonIdx === 0;
  const isLast = currentLessonIdx === LESSONS.length - 1;
  document.getElementById('top-prev').disabled = isFirst;
  document.getElementById('bot-prev').disabled = isFirst;
  document.getElementById('top-next').disabled = isLast;
  document.getElementById('bot-next').disabled = isLast;
  if (!isLast) {
    const nextLesson = LESSONS[currentLessonIdx + 1];
    document.getElementById('bot-next').innerHTML = `Next: ${nextLesson.num} ${nextLesson.navTitle} &rarr;`;
  } else {
    document.getElementById('bot-next').innerHTML = `Completed All Lessons &check;`;
  }
}

/* Show, hide and highlight progressive SVG elements for the current step. */
function applyProgressiveState(visualIdx, animate) {
  const { definition, step } = lessonVisuals[visualIdx];
  if (!definition.svg) return;
  const svgElement = document.querySelector(`#visual-${visualIdx} svg`);
  if (!svgElement) return;
  const shouldAnimate = animate && !reducedMotionQuery.matches;

  svgElement.querySelectorAll('[data-step], [data-until], [data-focus]').forEach(element => {
    const firstStep = element.hasAttribute('data-step') ? Number(element.dataset.step) : 0;
    const lastStep = element.hasAttribute('data-until') ? Number(element.dataset.until) : Infinity;
    const isVisible = step >= firstStep && step <= lastStep;
    const wasHidden = element.classList.contains('is-hidden');
    element.classList.toggle('is-hidden', !isVisible);

    const focusSteps = (element.dataset.focus || '').split(/\s+/).filter(Boolean).map(Number);
    element.classList.toggle('is-focus', isVisible && focusSteps.includes(step));

    if (isVisible && wasHidden && shouldAnimate && element.classList.contains('draw')) {
      drawIn(element);
    }
  });
}

function drawIn(element) {
  if (typeof element.getTotalLength !== 'function') return;
  const pathLength = element.getTotalLength();
  element.classList.remove('flow-line');
  const markerEnd = element.getAttribute('marker-end');
  if (markerEnd) element.removeAttribute('marker-end');
  element.style.strokeDasharray = `${pathLength}`;
  element.style.strokeDashoffset = `${pathLength}`;
  element.getBoundingClientRect();
  element.style.transition = 'stroke-dashoffset 0.7s ease-out';
  element.style.strokeDashoffset = '0';
  element.addEventListener('transitionend', () => {
    element.style.transition = '';
    element.style.strokeDasharray = '';
    element.style.strokeDashoffset = '';
    if (element.hasAttribute('data-flow')) element.classList.add('flow-line');
    if (markerEnd) element.setAttribute('marker-end', markerEnd);
  }, { once: true });
}

function setVisualStep(visualIdx, requestedStep, fromUser) {
  const visual = lessonVisuals[visualIdx];
  if (!visual) return;
  const totalSteps = stepCount(visual.definition);
  if (requestedStep < 0 || requestedStep >= totalSteps) return;
  if (fromUser) stopAutoplay(visualIdx);
  activeVisualIdx = visualIdx;
  visual.step = requestedStep;

  const figure = document.getElementById(`visual-${visualIdx}`);
  const current = stepAt(visual.definition, requestedStep);
  figure.querySelectorAll('.anim-tab').forEach((tab, idx) => {
    tab.classList.toggle('active', idx === requestedStep);
    tab.setAttribute('aria-selected', String(idx === requestedStep));
  });
  figure.querySelector('.anim-narration').innerHTML = current.narration;

  if (visual.definition.svg) {
    applyProgressiveState(visualIdx, true);
  } else {
    const svgWrap = figure.querySelector('.svg-wrap');
    svgWrap.innerHTML = current.svg;
    if (!reducedMotionQuery.matches) {
      svgWrap.classList.remove('fade-in');
      svgWrap.getBoundingClientRect();
      svgWrap.classList.add('fade-in');
    }
  }

  const counter = figure.querySelector('[data-role="counter"]');
  if (counter) {
    counter.textContent = `Step ${requestedStep + 1} of ${totalSteps}`;
    figure.querySelector('[data-role="back"]').disabled = requestedStep === 0;
    figure.querySelector('[data-role="next"]').disabled = requestedStep === totalSteps - 1;
    figure.querySelectorAll('.step-dots .dot').forEach((dot, idx) => dot.classList.toggle('on', idx <= requestedStep));
  }
}

function toggleAutoplay(visualIdx) {
  const visual = lessonVisuals[visualIdx];
  if (visual.timer) {
    stopAutoplay(visualIdx);
    return;
  }
  const totalSteps = stepCount(visual.definition);
  if (visual.step === totalSteps - 1) setVisualStep(visualIdx, 0, false);
  activeVisualIdx = visualIdx;
  visual.timer = setInterval(() => {
    if (visual.step >= totalSteps - 1) {
      stopAutoplay(visualIdx);
      return;
    }
    setVisualStep(visualIdx, visual.step + 1, false);
    if (visual.step >= totalSteps - 1) stopAutoplay(visualIdx);
  }, AUTOPLAY_INTERVAL_MS);
  setPlayButton(visualIdx, true);
}

function stopAutoplay(visualIdx) {
  const visual = lessonVisuals[visualIdx];
  if (!visual || !visual.timer) return;
  clearInterval(visual.timer);
  visual.timer = null;
  setPlayButton(visualIdx, false);
}

function stopAllAutoplay() {
  lessonVisuals.forEach((_, idx) => stopAutoplay(idx));
}

function setPlayButton(visualIdx, isPlaying) {
  const playButton = document.querySelector(`#visual-${visualIdx} [data-role="play"]`);
  if (!playButton) return;
  playButton.innerHTML = isPlaying ? '&#10074;&#10074; Pause' : '&#9654; Play';
  playButton.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play all steps');
}

function toggleNav(button) {
  const isOpen = document.querySelector('.sidebar').classList.toggle('open');
  button.setAttribute('aria-expanded', String(isOpen));
}

function goLesson(idx, options = {}) {
  document.querySelector('.sidebar').classList.remove('open');
  currentLessonIdx = idx;
  renderSidebar();
  renderLesson();
  const lessonHash = `#${LESSONS[idx].num}`;
  if (location.hash !== lessonHash) history.replaceState(null, '', lessonHash);
  if (!options.keepScroll) window.scrollTo({ top: 0, behavior: reducedMotionQuery.matches ? 'auto' : 'smooth' });
}

function nextLesson() {
  if (currentLessonIdx < LESSONS.length - 1) goLesson(currentLessonIdx + 1);
}

function prevLesson() {
  if (currentLessonIdx > 0) goLesson(currentLessonIdx - 1);
}

function lessonIdxFromHash() {
  const requestedNum = decodeURIComponent(location.hash.slice(1));
  const foundIdx = LESSONS.findIndex(lesson => lesson.num === requestedNum);
  return foundIdx >= 0 ? foundIdx : 0;
}

/* Arrow keys step through the active visual first, then move between lessons. */
window.addEventListener('keydown', (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const targetTag = (event.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(targetTag)) return;
  const visual = lessonVisuals[activeVisualIdx];
  if (event.key === 'ArrowRight') {
    if (visual && visual.step < stepCount(visual.definition) - 1) setVisualStep(activeVisualIdx, visual.step + 1, true);
    else nextLesson();
  }
  if (event.key === 'ArrowLeft') {
    if (visual && visual.step > 0) setVisualStep(activeVisualIdx, visual.step - 1, true);
    else prevLesson();
  }
});

window.addEventListener('hashchange', () => {
  const hashIdx = lessonIdxFromHash();
  if (hashIdx !== currentLessonIdx) goLesson(hashIdx);
});

goLesson(lessonIdxFromHash(), { keepScroll: true });
</script>
</body>
